name: Windows using MSVC 

# Runs the physics guest through the sandbox host on Windows (x86_64)
# to compute the state digest and export the built Windows DLL as a downloadable artifact.

on:
  push:
    paths:
      - "project/**"
      - "tools/determinism/**"
      - "patches/**"
      - ".github/workflows/fp-determinism.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  FORK: "https://github.com/V-Sekai-fire/godot-sandbox"

jobs:
  digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build setup (Windows) ---
      - name: Setup Ninja (Windows)
        uses: llvm/actions/install-ninja@main

      - name: Set up MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      # --- Build the extension natively using MSVC ---
      - name: Build the sandbox extension from the fork
        shell: bash
        run: |
          set -e

          # Ensure consistent line endings across operating systems
          git config --global core.autocrlf false

          git clone --recursive --depth 1 "$FORK" gs

          # Apply the vendored-dependency patches with whitespace/line-ending tolerance
          git -C gs/ext/libriscv apply --ignore-space-change --ignore-whitespace "$GITHUB_WORKSPACE/patches/libriscv-paging-and-includes.patch"
          git -C gs/ext/godot-cpp apply --ignore-space-change --ignore-whitespace "$GITHUB_WORKSPACE/patches/godot-cpp-stdlib-include.patch"

          # Configure CMake using default MSVC compiler (cl.exe) initialized by msvc-dev-cmd
          cmake -S gs -B gs/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SAFEGDSCRIPT=OFF \
            -DRISCV_BINARY_TRANSLATION=OFF

          cmake --build gs/build -j --target godot-riscv

          BINARY=$(find gs/build -name 'godot_riscv*.dll' -o -name 'libgodot_riscv*.dll' | head -1)
          test -n "$BINARY"
          TARGET_PATH="project/addons/godot_sandbox/bin/godot_riscv.windows.template_release.x86_64.dll"

          mkdir -p project/addons/godot_sandbox/bin
          cp "$BINARY" "$TARGET_PATH"
          echo "Installed $BINARY -> $TARGET_PATH"

      # --- Download Godot ---
      - name: Get Godot (Windows)
        shell: bash
        run: |
          set -e
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          curl -fL "$URL" -o godot.zip
          unzip -o godot.zip
          mv Godot_v${GODOT_VERSION}_win64.exe godot.exe

      # --- Compute Digest ---
      - name: Compute digest
        shell: bash
        run: |
          set -e
          GODOT="$GITHUB_WORKSPACE/godot.exe"
          cd project
          "$GODOT" --headless --path . --import 2>&1 | tail -3 || true
          OUT=$("$GODOT" --headless --path . -s ../tools/determinism/digest.gd 2>&1)
          echo "$OUT"
          LINE=$(echo "$OUT" | grep -o 'DIGEST=[0-9-]* STEPS=[0-9]* NQ=[0-9]*' | head -1)
          test -n "$LINE"
          echo "$LINE" > "$GITHUB_WORKSPACE/digest-windows-x86_64.txt"

      # --- Upload Digest Artifact ---
      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-windows-x86_64
          path: digest-windows-x86_64.txt

      # --- Upload Windows Compiled DLL Binary Artifact ---
      - name: Upload Windows DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot_riscv-windows-x86_64
          path: project/addons/godot_sandbox/bin/*.dll
        with:
          name: godot_riscv-windows-x86_64
          path: project/addons/godot_sandbox/bin/*.dll
